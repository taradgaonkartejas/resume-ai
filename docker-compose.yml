services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resumeai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin123
      POSTGRES_DB: resumeai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d resumeai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: resumeai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-insight:
    image: redis/redisinsight:latest
    container_name: resumeai-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      # Without this the saved Redis connection is lost on every restart.
      - redisinsightdata:/data
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    container_name: resumeai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # These are the ONLY MinIO credentials. minio-init and the app must
      # both use exactly these values.
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: resumeai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    # Credentials below MUST match MINIO_ROOT_USER / MINIO_ROOT_PASSWORD above.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/resumeai-uploads &&
      mc mb --ignore-existing local/resumeai-exports &&
      mc anonymous set download local/resumeai-exports &&
      echo 'buckets ready'
      "

volumes:
  pgdata:
  miniodata:
  redisdata:
  redisinsightdata: